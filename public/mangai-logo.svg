<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 84" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoMauveGrad" x1="10" y1="10" x2="70" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#845D6D" />
      <stop offset="60%" stop-color="#654653" />
      <stop offset="100%" stop-color="#49303A" />
    </linearGradient>
    <linearGradient id="logoRoseGrad" x1="20" y1="15" x2="60" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2D8D6" />
      <stop offset="100%" stop-color="#C99692" />
    </linearGradient>
    <linearGradient id="logoSageGrad" x1="25" y1="20" x2="55" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C5D3C1" />
      <stop offset="100%" stop-color="#7B9375" />
    </linearGradient>
    <radialGradient id="logoHaloGlow" cx="42" cy="42" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBF5EF" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#F5EAE6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#EADBCE" stop-opacity="0.5" />
    </radialGradient>
  </defs>

  <!-- EMBLEM ICON (Left) -->
  <g transform="translate(0, 0)">
    <!-- Halo -->
    <circle cx="42" cy="42" r="38" fill="url(#logoHaloGlow)" stroke="#E8DDD2" stroke-width="1.2" />
    <circle cx="42" cy="42" r="35" fill="none" stroke="#E8C7C4" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.6" />

    <!-- Sage Leaves -->
    <path d="M42 61 C32 58 23 50 24 40 C26 33 32 37 36 44 C39 50 41 57 42 61 Z" fill="url(#logoSageGrad)" opacity="0.85" />
    <path d="M42 61 C52 58 61 50 60 40 C58 33 52 37 48 44 C45 50 43 57 42 61 Z" fill="url(#logoSageGrad)" opacity="0.85" />

    <!-- Mauve Outer Petals / M Wings -->
    <path d="M42 64 C32 62 20 54 20 37 C20 25 31 18 36 26 C39 30 40 37 42 43 C39 34 35 25 30 25 C24 25 24 33 25 40 C27 50 35 57 42 58 Z" fill="url(#logoMauveGrad)" />
    <path d="M42 64 C52 62 64 54 64 37 C64 25 53 18 48 26 C45 30 44 37 42 43 C45 34 49 25 54 25 C60 25 60 33 59 40 C57 50 49 57 42 58 Z" fill="url(#logoMauveGrad)" />

    <!-- Inner Rose Petals -->
    <path d="M42 53 C36 51 29 46 29 36 C29 28 35 24 39 29 C40 31 41 36 42 40 C40 35 38 29 35 29 C32 29 32 33 33 38 C35 43 39 48 42 49 Z" fill="url(#logoRoseGrad)" />
    <path d="M42 53 C48 51 55 46 55 36 C55 28 49 24 45 29 C44 31 43 36 42 40 C44 35 46 29 49 29 C52 29 52 33 51 38 C49 43 45 48 42 49 Z" fill="url(#logoRoseGrad)" />

    <!-- Center Bud & Droplet -->
    <path d="M42 21 C40.5 26 38 33 39 39 C40 42 42 44 42 44 C42 44 44 42 45 39 C46 33 43.5 26 42 21 Z" fill="url(#logoMauveGrad)" />
    <circle cx="42" cy="32" r="1.8" fill="#FFFFFF" />
    <circle cx="42" cy="19" r="1" fill="#654653" />
  </g>

  <!-- TYPOGRAPHY (Right) -->
  <g transform="translate(94, 0)">
    <!-- Main Name: MANGAI CLINIC -->
    <text x="0" y="32" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="24" font-weight="600" fill="#654653" letter-spacing="0.1em">
      MANGAI
    </text>
    <text x="122" y="32" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="20" font-weight="400" fill="#383331" letter-spacing="0.15em">
      CLINIC
    </text>

    <!-- Subtitle: Women's Health & Maternity -->
    <text x="0" y="50" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#654653" letter-spacing="0.04em" opacity="0.9">
      Women’s Health • Maternity • Fertility
    </text>

    <!-- Location & Tamil Script Tagline -->
    <text x="0" y="67" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#756C68" letter-spacing="0.03em">
      Salem, Tamil Nadu • <tspan fill="#654653" font-weight="500">மங்கை கிளினிக்</tspan>
    </text>
  </g>
</svg>

